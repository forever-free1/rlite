[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlite"
version = "0.1.0"
description = "A lightweight framework for reproducing LLM policy-optimization algorithms"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "rlite contributors"}
]
keywords = [
    "rlhf",
    "grpo",
    "lora",
    "llm",
    "reinforcement-learning",
    "post-training",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "accelerate>=0.28.0",
    "datasets>=2.18.0",
    "pyyaml>=6.0",
    "ray[default]>=2.20.0",
]

[project.optional-dependencies]
vllm = [
    "vllm==0.6.6.post1",
    "transformers==4.47.1",
    "mistral-common==1.5.1",
    "opencv-python-headless==4.11.0.86",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
docs = [
    "myst-parser>=2.0",
    "sphinx>=7.0",
]
all = ["rlite[vllm,dev,docs]"]

[project.scripts]
rlite-train = "rlite.train:main"
rlite-ray-train = "rlite.ray_train:main"
rlite-eval = "rlite.eval:main"

[tool.setuptools.packages.find]
include = ["rlite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
